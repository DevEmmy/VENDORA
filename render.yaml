# One-click deploy of the Vendora server on Render (free plan works for demos).
# It holds the YarnGPT key so the website never exposes it.
services:
  - type: web
    name: vendora-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: YARNGPT_API_KEY
        sync: false
      - key: YARNGPT_VOICE
        value: idera
      - key: CORS_ORIGINS
        value: https://devemmy.github.io
