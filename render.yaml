# One-click deploy on Render (free plan): the Vendora website and the Vendora server.
# The server holds the YarnGPT key so the website never exposes it.
services:
  - type: web
    name: vendora-app
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_TTS_URL
        value: https://vendora-server-pt7c.onrender.com

  - type: web
    name: vendora-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_PRIVATE_KEY
        sync: false
      - key: AUTH_PUBLIC_KEY
        sync: false
      - key: AUTH_KEY_ID
        sync: false
      - key: AUTH_ISSUER
        sync: false
      - key: AUTH_AUDIENCE
        sync: false
      - key: DELIVERY_ENCRYPTION_KEY
        sync: false
      - key: DELIVERY_URL
        sync: false
      - key: DELIVERY_TOKEN
        sync: false
      - key: TRUST_PROXY
        sync: false
      - key: YARNGPT_API_KEY
        sync: false
      - key: YARNGPT_VOICE
        value: idera
      - key: CORS_ORIGINS
        sync: false
