name: Backend authentication checks
on:
  push:
    paths: ['server/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vendora-ci-only
          POSTGRES_DB: vendora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:vendora-ci-only@localhost:5432/vendora_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm audit --omit=dev
